# SysY编译器测试框架配置文件

# zip_dir：编译器源码压缩包目录（相对于本项目工作区根目录）
compiler_project_dir: "zips/"

# Mars模拟器文件名
mars_jar: "tools/Mars.jar"

# 工具路径配置 (留空则使用环境变量PATH中的)
tools:
  jdk_home: ""       # JDK安装目录，如 "C:/Program Files/Java/jdk-17"
  gcc_path: ""       # gcc/g++可执行文件路径
  cmake_path: "C:/Program Files/CMake/bin/cmake.exe"     # Cmake 安装路径，如 "C:/Program Files/CMake/bin/cmake.exe"
  # JVM 参数（用于运行 Compiler.jar / Mars.jar），可按机器资源调整。
  # 说明：评测会启动大量短生命周期 JVM；限制其线程数/GC 可显著提升并发吞吐。
  java_options:
    - "-XX:+UseSerialGC"
    - "-XX:TieredStopAtLevel=1"
    - "-XX:ActiveProcessorCount=1"
    - "-XX:+DisableExplicitGC"
    - "-XX:-UsePerfData"
    - "-Djava.awt.headless=true"


# 超时设置 (秒)
timeout:
  compile: 60          # 编译器编译超时
  mars: 30             # Mars执行超时
  gcc_compile: 30      # g++编译超时
  gcc_run: 120         # g++运行超时
  java_compile: 120    # Java项目编译超时
  cmake_configure: 120
  cmake_build: 600

# 并行测试设置
parallel:
  max_workers: 24

# MIPS 指令周期权重 (用于计算加权 cycle)
instruction_weights:
  Division: 15
  Multiply: 5
  "Jump/Branch": 2
  Memory: 3
  Others: 1

# C语言头文件 (用于g++编译)
c_header: |
  #include <stdio.h>

  int getint() {
      int x;
      scanf("%d", &x);
      return x;
  }

# GUI设置
gui:
  window_width: 1000
  window_height: 750
  font_family:
    - "Maple Mono NF"
    - "Consolas"
    - "Monaco"
    - "Courier New"
    - "monospace"
  font_size: 10
